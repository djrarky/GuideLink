name: Publish verified GuideLink v0.1.8

on:
  push:
    tags: ['publish-guidelink-v0.1.8-retry4']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.1.8
      RELEASE_COMMIT: 74db3bd685091baf95d1bbfb199601fd49aafc68
    steps:
      - name: Checkout the tested release
        uses: actions/checkout@v4
        with:
          ref: v0.1.8
          fetch-depth: 0

      - name: Verify tag, validation, notes and draft
        run: |
          trap 'echo "::error::Publication verification failed at shell line $LINENO"' ERR
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yaml/runs?head_sha=$RELEASE_COMMIT&per_page=100" > "$RUNNER_TEMP/release-runs.json"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python3 - <<'PY'
          import json
          import sys
          sys.excepthook = lambda kind, value, tb: print(f'::error::{kind.__name__}: {value}', file=sys.stderr)
          import os
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          runs = json.loads((temp / 'release-runs.json').read_text())['workflow_runs']
          assert any(r['head_sha'] == os.environ['RELEASE_COMMIT'] and r['head_branch'] == os.environ['RELEASE_TAG'] and r['event'] == 'push' and r['status'] == 'completed' and r['conclusion'] == 'success' for r in runs), 'Release validation has not passed'
          releases = json.loads((temp / 'releases.json').read_text())
          matches = [r for r in releases if r['tag_name'] == os.environ['RELEASE_TAG']]
          assert len(matches) == 1, f"Expected one release for {os.environ['RELEASE_TAG']}, found {len(matches)}"
          release = matches[0]
          (temp / 'release-before.json').write_text(json.dumps(release))
          assert release['tag_name'] == os.environ['RELEASE_TAG'], f"Unexpected tag: {release['tag_name']}"
          assert release['name'] == 'GuideLink v0.1.8', f"Unexpected release name: {release['name']}"
          assert release['draft'] and not release['prerelease'], f"Unexpected release state: draft={release['draft']}, prerelease={release['prerelease']}"
          assert release['body'].strip() == Path('.github/release-notes/v0.1.8.md').read_text().strip(), 'Draft notes differ from tagged notes'
          assert sorted(a['name'] for a in release['assets']) == ['SHA256SUMS', 'guidelink.zip', 'release.json'], f"Unexpected assets: {[a['name'] for a in release['assets']]}"
          assert all(a['state'] == 'uploaded' and a['size'] > 0 for a in release['assets']), 'Assets are incomplete'
          print('Exact release commit, successful CI, authored notes and three draft assets verified.')
          PY

      - name: Verify packaged files against the tested installation and tagged source
        run: |
          python3 - <<'PYASSETS'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path
          sys.excepthook = lambda kind, value, tb: print(f'::error::{kind.__name__}: {value}', file=sys.stderr)
          temp = Path(os.environ['RUNNER_TEMP'])
          release = json.loads((temp / 'release-before.json').read_text())
          destination = temp / 'publish-assets'
          destination.mkdir()
          for asset in release['assets']:
              with (destination / asset['name']).open('wb') as output:
                  subprocess.run(['gh', 'api', '-H', 'Accept: application/octet-stream',
                      f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/assets/{asset['id']}"],
                      stdout=output, check=True)
          PYASSETS
          python3 scripts/package-release.py --output "$RUNNER_TEMP/rebuilt-assets"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import sys
          import zipfile
          from pathlib import Path
          sys.excepthook = lambda kind, value, tb: print(f'::error::{kind.__name__}: {value}', file=sys.stderr)
          temp = Path(os.environ['RUNNER_TEMP'])
          downloaded = temp / 'publish-assets'
          rebuilt = temp / 'rebuilt-assets'
          for name in ['guidelink.zip', 'SHA256SUMS', 'release.json']:
              assert (downloaded / name).read_bytes() == (rebuilt / name).read_bytes(), f'Asset mismatch: {name}'
          assert hashlib.sha256((downloaded / 'release.json').read_bytes()).hexdigest() == '3f872250bcae75e3a92aeec286bfafd172c4725d399c426f833baeb54a41df09', 'File inventory differs from the tested live installation'
          inventory = json.loads((downloaded / 'release.json').read_text())['files']
          with zipfile.ZipFile(downloaded / 'guidelink.zip') as archive:
              assert len(archive.namelist()) == len(inventory), 'Unexpected ZIP entries'
              actual = {name.removeprefix('guidelink/'): hashlib.sha256(archive.read(name)).hexdigest() for name in archive.namelist()}
          assert actual == inventory, 'Packaged file hashes differ from the tested live installation'
          print('All assets match the tagged source; every packaged file matches the tested live installation.')
          PY

      - name: Publish the verified draft
        run: |
          python3 - <<'PY'
          import json
          import sys
          sys.excepthook = lambda kind, value, tb: print(f'::error::{kind.__name__}: {value}', file=sys.stderr)
          import os
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          release = json.loads((temp / 'release-before.json').read_text())
          (temp / 'publish.json').write_text(json.dumps({'draft': False, 'tag_name': os.environ['RELEASE_TAG'], 'make_latest': 'true'}))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f"RELEASE_ID={release['id']}\n")
          PY

      - name: Complete and verify publication
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --input "$RUNNER_TEMP/publish.json" > "$RUNNER_TEMP/release-after.json"
          python3 - <<'PY'
          import json
          import sys
          sys.excepthook = lambda kind, value, tb: print(f'::error::{kind.__name__}: {value}', file=sys.stderr)
          import os
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          before = json.loads((temp / 'release-before.json').read_text())
          after = json.loads((temp / 'release-after.json').read_text())
          assert not after['draft'] and after['published_at'] and after['tag_name'] == os.environ['RELEASE_TAG']
          for key in ['id', 'name', 'target_commitish', 'prerelease', 'body']:
              assert after[key] == before[key], f'Unexpected metadata change: {key}'
          def assets(release):
              return sorted((a['id'], a['name'], a['size'], a.get('digest')) for a in release['assets'])
          assert assets(after) == assets(before), 'Release assets changed'
          print(after['html_url'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Published [{after['name']}]({after['html_url']}) after verifying release CI, notes, source and tested archive.\n")
          PY
